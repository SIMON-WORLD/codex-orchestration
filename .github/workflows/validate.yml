name: validate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate tool reference
        run: node scripts/emit_tool_inventory.mjs
      - name: Fail if generated doc is stale
        run: |
          git diff --exit-code -- docs/03-tool-reference.md || {
            echo "::error::docs/03-tool-reference.md 已过期，请重跑 node scripts/emit_tool_inventory.mjs 并提交生成结果。"
            exit 1
          }
      - name: Validate SKILL.md frontmatter
        run: |
          node -e "const fs=require('fs'); for(const f of ['skills/codex-orchestration/SKILL.md','skills/codex-role-team/SKILL.md']){ const s=fs.readFileSync(f,'utf8'); if(!s.startsWith('---')){throw new Error(f+' 缺少 frontmatter');} if(!/^name:\s*\S/m.test(s)){throw new Error(f+' 缺 name');} if(!/^description:\s*\S/m.test(s)){throw new Error(f+' 缺 description');} console.log('OK '+f); }"
      - name: Validate compat-mode separation (v1.2 vs v1.3)
        run: |
          node scripts/scaffold_role_team.mjs --roles templates/role-team/roles.json --out role-team-out/_gen.json
          node scripts/scaffold_role_team.mjs --roles templates/role-team/roles.research.json --out role-team-out/_res.json
          node -e "const g=require('./role-team-out/_gen.json'); const r=require('./role-team-out/_res.json'); if(g.meta.compatibility_mode) throw new Error('通用 roles.json 不应有 compatibility_mode'); if(r.meta.compatibility_mode!=='legacy_v1_2') throw new Error('roles.research.json 应标记 legacy_v1_2'); console.log('OK: generic=no-compat; research=legacy_v1_2')"
      - name: Validate real capability schema
        run: node core/validate_capability_schema.mjs
      - name: Run capability schema rejection spec
        run: node tests/schema.spec.mjs
      - name: Validate role pack schema
        run: node core/validate_role_scope.mjs
      - name: Run role scope / dispatch spec
        run: node tests/role_scope.spec.mjs
      - name: Run Capability Resolver fixture spec
        run: node tests/resolver.spec.mjs
      - name: Guard against fabricated verified in real registry
        run: |
          node -e "const fs=require('fs'); const dir='domains/economics/capabilities'; for(const f of fs.readdirSync(dir)){ if(!f.endsWith('.json')||f==='index.json') continue; const c=JSON.parse(fs.readFileSync(dir+'/'+f,'utf8')); for(const i of c.implementations||[]){ if(i.verification_status==='verified') throw new Error(f+' 有虚标 verified，真实 registry 不得在无 benchmark evidence 下标 verified'); } } console.log('OK real registry no fabricated verified')"
      - name: Validate research role schema
        run: node scripts/scaffold_role_team.mjs --roles templates/role-team/roles.research.json --dry-run
      - name: No secrets in tracked files
        run: |
          if git ls-files | grep -iE 'token|secret|\.codex/' ; then
            echo "::error::发现疑似敏感文件入库。"
            exit 1
          fi






